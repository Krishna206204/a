<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Marks</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800">
    <div class="min-h-screen bg-gradient-to-br from-emerald-50 via-white to-slate-100 px-4 py-8 sm:px-6 lg:px-8">
      <div class="mx-auto max-w-6xl space-y-6">
        <div class="flex flex-col gap-3 rounded-[2rem] border border-slate-200 bg-white p-6 shadow-sm sm:flex-row sm:items-center sm:justify-between">
          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.25em] text-slate-500">Student</p>
            <h2 class="mt-2 text-2xl font-semibold text-slate-900">{{ student.name }}</h2>
          </div>
          <a href="{% url 'student-dashboard' student_id=student.id %}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100">
            Back to Dashboard
          </a>
        </div>

        <div class="overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-sm">
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200 text-left text-sm">
              <thead class="bg-slate-50 text-slate-600">
                <tr>
                  <th class="px-5 py-3 font-semibold">Subject</th>
                  <th class="px-5 py-3 font-semibold">Exam Name</th>
                  <th class="px-5 py-3 font-semibold">Marks Obtained</th>
                  <th class="px-5 py-3 font-semibold">Full Marks</th>
                  <th class="px-5 py-3 font-semibold">Percentage</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200 bg-white text-slate-700">
                {% for row in mark_rows %}
                <tr>
                  <td class="px-5 py-3 font-medium text-slate-900">{{ row.subject }}</td>
                  <td class="px-5 py-3">{{ row.exam_name }}</td>
                  <td class="px-5 py-3">{{ row.marks_obtained }}</td>
                  <td class="px-5 py-3">{{ row.full_marks }}</td>
                  <td class="px-5 py-3">{{ row.percentage }}%</td>
                </tr>
                {% empty %}
                <tr>
                  <td colspan="5" class="px-5 py-6 text-center text-slate-500">No marks found for this student.</td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
