<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-800">
    <div
      class="flex min-h-screen items-center justify-center bg-gradient-to-br from-emerald-50 via-white to-slate-100 px-4 py-6 sm:px-6 lg:px-8"
    >
      <div
        class="w-full max-w-xl rounded-[1.5rem] border border-slate-200 bg-white/90 p-6 shadow-sm backdrop-blur sm:p-8"
      >
        <a
          href="{% url 'login-selection' %}"
          class="absolute -top-0 left-1/2 -translate-x-1/2 inline-flex items-center gap-1.5 rounded-xl bg-blue-500 px-4 py-1 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-600"
        >
        <i class="fa-solid fa-arrow-left"></i>
          <p>Back</p>
        </a>

        <div class="text-center">
          <div
            class="mx-auto flex h-12 w-12 items-center justify-center rounded-xl bg-slate-900 text-xl font-semibold text-white"
          >
            S
          </div>

          <h2 class="mt-3 text-2xl font-semibold text-slate-900">
            Welcome to the Student Portal
          </h2>

          <p class="mt-2 text-sm text-slate-600">
            Enter your Student ID to access your academic dashboard.
          </p>
        </div>

        <form method="post" class="mt-6 space-y-4">
          {% csrf_token %}

          <!-- Student ID -->
          <div>
            <label
              for="student_id"
              class="mb-1.5 block text-sm font-medium text-slate-700"
            >
              Student ID
            </label>

            <input
              id="student_id"
              name="student_id"
              type="text"
              inputmode="numeric"
              required
              placeholder="Enter Student ID"
              class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
            />
          </div>

          <div>
            <label
              for="date_of_birth"
              class="mb-1.5 block text-sm font-medium text-slate-700"
            >
              Date of birth
            </label>

            <input
              id="date_of_birth"
              name="date_of_birth"
              type="date"
              inputmode="numeric"
              maxlength="10"
              required
              placeholder="Enter Your date of birth "
              class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
            />
          </div>

          {% if error_message %}
          <div
            class="rounded-xl border border-red-200 bg-red-50 px-4 py-2.5 text-sm text-red-700"
          >
            {{ error_message }}
          </div>
          {% endif %}

          <!-- Login Button -->
          <button
            type="submit"
            class="w-full rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-800"
          >
            Continue to Dashboard
          </button>
        </form>

        <div class="mt-5 text-center">
          <p class="text-sm text-slate-600">Are you a teacher?</p>

          <a
            href="{% url 'login' %}"
            class="mt-2 inline-flex items-center rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700"
          >
            <i class="fa-solid fa-user-tie mr-2"></i>
            Teacher Login
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
